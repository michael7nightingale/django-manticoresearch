[tox]
envlist =
    {py3.10,py3.11,py3.13}-django5.2

[gh-actions]
python =
    3.10: py3.10
    3.11: py3.11
    3.13: py3.13
[testenv]
basepython =
    py3.10: python3.10
    py3.11: python3.11
    py3.13: python3.13

deps =
    -r requirements.txt
    django5.2: Django~=5.2.0
commands =
    python manage.py test --verbosity=2

changedir = testproject