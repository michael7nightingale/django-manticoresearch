[project]
name = "django-manticoresearch"
dynamic = ["version"]
authors = [
  { name="michael7nightingale", email="suslanchikmopl@gmail.com" },
]
description = "Django integration for Manticore Search"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: Django",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "django>=3.2",
    "manticoresearch>=9.0.0",
    "ndjson>=0.3.1",
]

[project.urls]
Homepage = "https://github.com/michael7nightingale/django-manticoresearch"
Issues = "https://github.com/michael7nightingale/django-manticoresearch/issues"

[project.optional-dependencies]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.13.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_manticoresearch"]

[tool.hatch.build.targets.sdist]
include = ["/django_manticoresearch"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "regex"
pattern = '__version__ = "(?P<version>[^"]+)"'
path = "django_manticoresearch/version.py"
